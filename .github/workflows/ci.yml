name: CI

# Product gates only: each job builds and tests one product with its own
# native toolchain. There is no shared analysis layer — a green gate means the
# product itself built, passed its tests, and ran headlessly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loglens:
    name: LogLens build, test and smoke (Qt6)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev pkg-config

      - name: Configure and build
        working-directory: loglens
        run: |
          set -euo pipefail
          mkdir -p build
          cmake -S . -B build/gui -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON \
            2>&1 | tee build/configure.log
          selected_major="$(sed -n 's/^-- .*using Qt\([56]\) .*/\1/p' \
            build/configure.log | tail -1)"
          if [ "$selected_major" != 6 ]; then
            echo "::error::CMake selected Qt $selected_major, expected Qt 6"
            exit 1
          fi
          cmake --build build/gui --parallel 2
          if ! ldd build/gui/src/gui/loglens-gui | grep -Eq 'libQt6Widgets'; then
            echo "::error::loglens-gui is not linked to Qt6Widgets"
            ldd build/gui/src/gui/loglens-gui || true
            exit 1
          fi

      - name: Tests
        working-directory: loglens
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/gui --output-on-failure

      # Runs the real binary headlessly against a known log, so a GUI that
      # links but crashes on startup or on its first load still fails.
      - name: Headless smoke run
        working-directory: loglens
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          build/gui/src/gui/loglens-gui "$PWD/tests/data/sample.log" &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::GUI exited before the smoke window elapsed"
            exit 1
          fi
          echo "GUI stayed up through a log load"

      # The large-file benchmark is opt-in for local builds, but this small
      # deterministic run keeps the harness itself inside the PR gate.
      - name: Benchmark smoke
        working-directory: loglens
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          benchmark_root="$RUNNER_TEMP/loglens-benchmark"
          scratch_dir="$benchmark_root/scratch"
          artifact_dir="$benchmark_root/artifact"
          build_dir="$benchmark_root/build"
          mkdir -p "$scratch_dir" "$artifact_dir" "$build_dir"
          cmake -S . -B "$build_dir" -DCMAKE_BUILD_TYPE=Release \
            -DLOGLENS_BUILD_BENCHMARKS=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON
          cmake --build "$build_dir" --parallel 2 \
            --target loglens-bench-generate loglens-bench-core loglens-bench-gui
          python3 benchmarks/run_benchmark.py \
            --build-dir "$build_dir" \
            --scratch "$scratch_dir" \
            --artifact-dir "$artifact_dir" \
            --qt-major 6 \
            --generator "$build_dir/benchmarks/loglens-bench-generate" \
            --core "$build_dir/benchmarks/loglens-bench-core" \
            --gui "$build_dir/benchmarks/loglens-bench-gui" \
            --bytes 1048576 \
            --records 1000 \
            --capacities 64,256 \
            --repetitions 1 \
            --timeout-seconds 30 \
            --skip-budgets \
            --commit "$GITHUB_SHA"
          test -s "$artifact_dir/summary.json"
          python3 - "$artifact_dir/summary.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          summary = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if summary.get("decision", {}).get("status") != "pass":
              raise SystemExit("benchmark smoke did not report a correctness PASS")
          if not summary.get("samples") or not all(
              sample.get("checks", {}).get("correctness") is True
              for sample in summary["samples"]
          ):
              raise SystemExit("benchmark smoke contains a failed correctness sample")
          PY

      - name: Upload benchmark smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loglens-benchmark-smoke
          path: ${{ runner.temp }}/loglens-benchmark/artifact
          if-no-files-found: warn
          retention-days: 14

  diskmap:
    name: DiskMap build, test and smoke (Qt6)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install Qt6 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev pkg-config g++ cmake

      - name: Configure and build
        working-directory: diskmap
        run: |
          set -euo pipefail
          mkdir -p build
          cmake -S . -B build/gui -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee build/configure.log
          if ! grep -Eq 'diskmap: using Qt6 ' build/configure.log; then
            echo "::error::CMake did not report Qt 6"
            exit 1
          fi
          cmake --build build/gui --parallel 2
          if ! ldd build/gui/src/gui/diskmap-gui | grep -Eq 'libQt6Widgets'; then
            echo "::error::diskmap-gui is not linked to Qt6Widgets"
            ldd build/gui/src/gui/diskmap-gui || true
            exit 1
          fi

      - name: Tests
        working-directory: diskmap
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/gui --output-on-failure

      # Runs the real binary headlessly against a known directory, so a GUI
      # that links but crashes on startup or on its first scan still fails.
      - name: Headless smoke run
        working-directory: diskmap
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          build/gui/src/gui/diskmap-gui "$PWD/src" &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::GUI exited before the smoke window elapsed"
            exit 1
          fi
          echo "GUI stayed up through a scan"

      # Keeps the deterministic scan benchmark harness on the ordinary
      # quality path without pulling the full million-entry run into a PR.
      - name: Benchmark smoke
        working-directory: diskmap
        run: |
          set -euo pipefail
          benchmark_root="$RUNNER_TEMP/diskmap-benchmark"
          build_dir="$benchmark_root/build"
          artifact_dir="$benchmark_root/artifact"
          mkdir -p "$build_dir" "$artifact_dir"
          cmake -S . -B "$build_dir" -DCMAKE_BUILD_TYPE=Release \
            -DDISKMAP_BUILD_BENCHMARKS=ON
          cmake --build "$build_dir" --parallel 2 \
            --target diskmap-scan-benchmark
          python3 benchmarks/run_benchmark.py \
            --binary "$build_dir/benchmarks/diskmap-scan-benchmark" \
            --entries 10000 \
            --cancel-after 1000 \
            --timeout-seconds 30 \
            --skip-budgets \
            --output-dir "$artifact_dir"
          test -s "$artifact_dir/summary.json"
          python3 - "$artifact_dir/summary.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          summary = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if summary.get("status") != "pass":
              raise SystemExit("DiskMap benchmark smoke did not report PASS")
          samples = summary.get("samples", {})
          if not all(
              samples.get(name, {}).get("correctness") is True
              for name in ("full", "cancelled")
          ):
              raise SystemExit("DiskMap benchmark smoke contains a failed correctness sample")
          PY

      - name: Upload benchmark smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diskmap-benchmark-smoke-qt6
          path: ${{ runner.temp }}/diskmap-benchmark/artifact
          if-no-files-found: warn
          retention-days: 14

  buildscope:
    name: BuildScope build, test and smoke (Qt6)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev pkg-config

      - name: Configure and build
        working-directory: buildscope
        run: |
          set -euo pipefail
          mkdir -p build
          cmake -S . -B build/gui -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON \
            2>&1 | tee build/configure.log
          selected_major="$(sed -n 's/^-- .*using Qt\([56]\) .*/\1/p' \
            build/configure.log | tail -1)"
          if [ "$selected_major" != 6 ]; then
            echo "::error::CMake selected Qt $selected_major, expected Qt 6"
            exit 1
          fi
          cmake --build build/gui --parallel 2
          if ! ldd build/gui/src/gui/buildscope-gui | grep -Eq 'libQt6Widgets'; then
            echo "::error::buildscope-gui is not linked to Qt6Widgets"
            ldd build/gui/src/gui/buildscope-gui || true
            exit 1
          fi

      - name: Tests
        working-directory: buildscope
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/gui --output-on-failure

      # Runs the real binary headlessly against a known snapshot, so a GUI
      # that links but crashes on startup or on its first load still fails.
      - name: Headless smoke run
        working-directory: buildscope
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          build/gui/src/gui/buildscope-gui "$PWD/fixtures/sample.snapshot.json" &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::GUI exited before the smoke window elapsed"
            exit 1
          fi
          echo "GUI stayed up through a snapshot load"

      # Exercises the production-size boundary on every PR so the lazy-model
      # claim stays measured rather than anecdotal.
      - name: 100k model benchmark
        working-directory: buildscope
        run: |
          set -euo pipefail
          benchmark_root="$RUNNER_TEMP/buildscope-benchmark"
          build_dir="$benchmark_root/build"
          artifact_dir="$benchmark_root/artifact"
          mkdir -p "$build_dir" "$artifact_dir"
          cmake -S . -B "$build_dir" -DCMAKE_BUILD_TYPE=Release \
            -DBUILDSCOPE_BUILD_BENCHMARKS=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON
          cmake --build "$build_dir" --parallel 2 --target buildscope-model-benchmark
          "$build_dir/buildscope-model-benchmark" 100000 10000 \
            | tee "$artifact_dir/summary.json"
          python3 - "$artifact_dir/summary.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          summary = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if summary.get("entries") != 100_000 or summary.get("sources") != 25_000:
              raise SystemExit(f"unexpected benchmark scale: {summary!r}")
          if summary.get("correct") is not True:
              raise SystemExit(f"model correctness failed: {summary!r}")
          if summary.get("filtered_sources") != 1:
              raise SystemExit(f"model filter failed: {summary!r}")
          if summary.get("model_build_ms", 10_001) > summary.get("budget_ms", 10_000):
              raise SystemExit(f"model budget exceeded: {summary!r}")
          if summary.get("filter_ms", 10_001) > summary.get("budget_ms", 10_000):
              raise SystemExit(f"filter budget exceeded: {summary!r}")
          PY

      - name: Upload benchmark smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildscope-benchmark-smoke
          path: ${{ runner.temp }}/buildscope-benchmark/artifact
          if-no-files-found: warn
          retention-days: 14

  buildscope-python:
    name: BuildScope Python quality (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.10"
            label: py310
          - python_version: "3.14"
            label: latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.label }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install pinned Python quality tools
        run: |
          set -euo pipefail
          python_bin="$(python -c 'import sys; print(sys.executable)')"
          tool_env="$RUNNER_TEMP/buildscope-python-${{ matrix.label }}"
          uv venv --python "$python_bin" "$tool_env"
          uv pip install --python "$tool_env/bin/python" \
            ruff==0.16.5 \
            pytest==9.1.1 \
            mypy==2.3.1
          echo "B5_PYTHON=$tool_env/bin/python" >> "$GITHUB_ENV"

      - name: Run Python tests, lint, format, and types
        run: |
          set -euo pipefail
          quality_root="$RUNNER_TEMP/buildscope-python-${{ matrix.label }}"
          (
            cd buildscope
            PYTHONPATH=python:. "$quality_root/bin/python" -m pytest tests/python
            "$quality_root/bin/ruff" check python tools tests/python
            "$quality_root/bin/ruff" format --check python tools tests/python
            MYPYPATH=python "$quality_root/bin/mypy" --python-version 3.10 \
              python/buildscope tools/build_standalone.py
          )

  envlens:
    name: envlens Python quality (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.10"
            label: py310
          - python_version: "3.14"
            label: latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.label }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install pinned Python quality tools
        run: |
          set -euo pipefail
          quality_root="$RUNNER_TEMP/envlens-python-${{ matrix.label }}"
          tool_env="$quality_root/tools"
          mkdir -p "$quality_root"
          python_bin="$(python -c 'import sys; print(sys.executable)')"
          uv venv --python "$python_bin" "$tool_env"
          uv pip install --python "$tool_env/bin/python" \
            ruff==0.16.5 \
            pytest==9.1.1 \
            mypy==2.3.1 \
            jsonschema==4.25.1
          echo "ENVLENS_PYTHON=$tool_env/bin/python" >> "$GITHUB_ENV"

      - name: Run envlens tests, lint, format, and types
        run: |
          set -euo pipefail
          quality_root="$RUNNER_TEMP/envlens-python-${{ matrix.label }}"
          mkdir -p "$quality_root/artifacts"
          (
            cd envlens
            PYTHONPATH=src "$ENVLENS_PYTHON" -m pytest tests
            "$quality_root/tools/bin/ruff" check src tests
            "$quality_root/tools/bin/ruff" format --check src tests
            "$quality_root/tools/bin/mypy" --strict --python-version 3.10 src/envlens
          )

      - name: Validate schema metaschema and real snapshot
        run: |
          set -euo pipefail
          quality_root="$RUNNER_TEMP/envlens-python-${{ matrix.label }}"
          artifact_dir="$quality_root/artifacts"
          PYTHONPATH=envlens/src "$ENVLENS_PYTHON" -m envlens snapshot \
            --interpreter "$ENVLENS_PYTHON" \
            --captured-at 2026-09-03T00:00:00Z \
            --output "$artifact_dir/real.snapshot.json"
          "$ENVLENS_PYTHON" - "$artifact_dir/real.snapshot.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          from jsonschema import Draft202012Validator, FormatChecker

          schema_path = Path("envlens/schemas/envlens-snapshot-v1.schema.json")
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          snapshot = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          Draft202012Validator(
              schema,
              format_checker=FormatChecker(),
          ).validate(snapshot)
          if snapshot.get("schema_version") != "envlens.snapshot/v1":
              raise SystemExit("real snapshot schema version mismatch")
          print("envlens schema metaschema and real snapshot validation: PASS")
          PY

      # envlens ships a pure-Python wheel and sdist; both must build
      # reproducibly and install into a clean environment with no extras.
      - name: Build and audit pure Python wheel and sdist
        run: |
          set -euo pipefail
          quality_root="$RUNNER_TEMP/envlens-python-${{ matrix.label }}"
          artifact_dir="$quality_root/artifacts"
          first_build="$artifact_dir/build-a"
          second_build="$artifact_dir/build-b"
          mkdir -p "$first_build" "$second_build"
          (cd envlens && SOURCE_DATE_EPOCH=1700000000 uv build --out-dir "$first_build")
          (cd envlens && SOURCE_DATE_EPOCH=1700000000 uv build --out-dir "$second_build")
          cmp "$first_build/envlens-0.1.0-py3-none-any.whl" \
            "$second_build/envlens-0.1.0-py3-none-any.whl"
          cmp "$first_build/envlens-0.1.0.tar.gz" \
            "$second_build/envlens-0.1.0.tar.gz"
          sha256sum "$first_build"/* > "$artifact_dir/SHA256SUMS"
          "$ENVLENS_PYTHON" - "$first_build" <<'PY'
          from email.parser import Parser
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          def exact_headers(
              payload: bytes,
              label: str,
              expected: dict[str, str],
          ) -> None:
              message = Parser().parsestr(payload.decode("utf-8"))
              for name, value in expected.items():
                  if message.get_all(name, []) != [value]:
                      raise SystemExit(
                          f"{label} metadata field {name!r} is not exactly {value!r}"
                      )

          artifact_dir = Path(sys.argv[1])
          wheel = artifact_dir / "envlens-0.1.0-py3-none-any.whl"
          sdist = artifact_dir / "envlens-0.1.0.tar.gz"
          for path in (wheel, sdist):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing envlens release artifact: {path}")

          with zipfile.ZipFile(wheel) as archive:
              archive_names = archive.namelist()
              if len(archive_names) != len(set(archive_names)):
                  raise SystemExit("envlens wheel contains duplicate members")
              names = set(archive_names)
              native = tuple(
                  name
                  for name in names
                  if name.lower().endswith((".so", ".pyd", ".dylib", ".dll"))
              )
              if native:
                  raise SystemExit(f"envlens wheel contains native extensions: {native!r}")
              wheel_meta_names = sorted(
                  name for name in names if name.endswith(".dist-info/WHEEL")
              )
              if len(wheel_meta_names) != 1:
                  raise SystemExit("envlens wheel must contain exactly one WHEEL metadata file")
              exact_headers(
                  archive.read(wheel_meta_names[0]),
                  "envlens wheel",
                  {
                      "Wheel-Version": "1.0",
                      "Root-Is-Purelib": "true",
                      "Tag": "py3-none-any",
                  },
              )
              required_members = (
                  "envlens/py.typed",
                  "envlens/schemas/envlens-snapshot-v1.schema.json",
              )
              for required_member in required_members:
                  if required_member not in names:
                      raise SystemExit(f"envlens wheel is missing {required_member}")
              metadata_names = sorted(
                  name for name in names if name.endswith(".dist-info/METADATA")
              )
              if len(metadata_names) != 1:
                  raise SystemExit(
                      "envlens wheel must contain exactly one METADATA file"
                  )
              metadata = Parser().parsestr(
                  archive.read(metadata_names[0]).decode("utf-8")
              )
              exact_headers(
                  archive.read(metadata_names[0]),
                  "envlens wheel",
                  {
                      "Name": "envlens",
                      "Version": "0.1.0",
                      "Requires-Python": ">=3.10",
                  },
              )
              if metadata.get_all("Requires-Dist", []) != []:
                  raise SystemExit("envlens wheel unexpectedly declares dependencies")

          with tarfile.open(sdist, "r:gz") as archive:
              archive_names = archive.getnames()
              if len(archive_names) != len(set(archive_names)):
                  raise SystemExit("envlens sdist contains duplicate members")
              names = set(archive_names)
              native = tuple(
                  name
                  for name in names
                  if name.lower().endswith((".so", ".pyd", ".dylib", ".dll"))
              )
              if native:
                  raise SystemExit(f"envlens sdist contains native extensions: {native!r}")
              pyproject_names = sorted(
                  name for name in names if name.endswith("/pyproject.toml")
              )
              if len(pyproject_names) != 1:
                  raise SystemExit(
                      "envlens sdist must contain exactly one pyproject.toml"
                  )
              schema_names = sorted(
                  name
                  for name in names
                  if name.endswith("/schemas/envlens-snapshot-v1.schema.json")
              )
              if len(schema_names) != 1:
                  raise SystemExit(
                      "envlens sdist must contain exactly one snapshot schema"
                  )
              pkg_info_names = sorted(
                  name for name in names if name.endswith("/PKG-INFO")
              )
              if len(pkg_info_names) != 1:
                  raise SystemExit("envlens sdist must contain exactly one PKG-INFO")
              pkg_info_file = archive.extractfile(pkg_info_names[0])
              if pkg_info_file is None:
                  raise SystemExit("envlens sdist PKG-INFO is not a regular file")
              with pkg_info_file:
                  pkg_info = pkg_info_file.read()
                  exact_headers(
                      pkg_info,
                      "envlens sdist",
                      {
                          "Name": "envlens",
                          "Version": "0.1.0",
                          "Requires-Python": ">=3.10",
                      },
                  )
                  if Parser().parsestr(pkg_info.decode("utf-8")).get_all(
                      "Requires-Dist", []
                  ) != []:
                      raise SystemExit(
                          "envlens sdist unexpectedly declares dependencies"
                      )
          print("envlens wheel/sdist pure-Python audit: PASS")
          PY
          consumer_env="$quality_root/wheel-consumer"
          uv venv --python "$ENVLENS_PYTHON" "$consumer_env"
          uv pip install --python "$consumer_env/bin/python" --no-deps \
            "$first_build/envlens-0.1.0-py3-none-any.whl"
          test "$("$consumer_env/bin/envlens" --version)" = "envlens 0.1.0"
          "$consumer_env/bin/envlens" snapshot \
            --interpreter "$consumer_env/bin/python" \
            --captured-at 2026-09-03T00:00:00Z \
            --output "$artifact_dir/wheel.snapshot.json"
          wheel_schema="$artifact_dir/wheel.schema.json"
          "$consumer_env/bin/python" - "$wheel_schema" <<'PY'
          import sys
          from importlib.resources import files
          from pathlib import Path

          schema = files("envlens") / "schemas" / "envlens-snapshot-v1.schema.json"
          Path(sys.argv[1]).write_bytes(schema.read_bytes())
          PY
          cmp "$wheel_schema" envlens/schemas/envlens-snapshot-v1.schema.json
          "$ENVLENS_PYTHON" - "$wheel_schema" "$artifact_dir/wheel.snapshot.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          snapshot = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          Draft202012Validator(
              schema,
              format_checker=FormatChecker(),
          ).validate(snapshot)
          if snapshot.get("schema_version") != "envlens.snapshot/v1":
              raise SystemExit("clean wheel snapshot schema version mismatch")
          print("clean installed wheel snapshot schema validation: PASS")
          PY
          {
            echo "python=${{ matrix.python_version }}"
            "$ENVLENS_PYTHON" --version
            "$quality_root/tools/bin/ruff" --version
            "$quality_root/tools/bin/pytest" --version
            "$quality_root/tools/bin/mypy" --version
            echo "schema=metaschema+source and clean-wheel snapshots PASS"
            echo "artifacts=reproducible wheel+sdist, py3-none-any, clean wheel smoke PASS"
            echo "status=PASS"
          } > "$quality_root/quality.txt"

      - name: Upload envlens quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: envlens-python-quality-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/envlens-python-${{ matrix.label }}/quality.txt
            ${{ runner.temp }}/envlens-python-${{ matrix.label }}/artifacts
          if-no-files-found: warn
          retention-days: 14

  abilens:
    name: AbiLens build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Build
        working-directory: abilens
        run: make -j2 all

      - name: Tests
        working-directory: abilens
        run: make test

  # Branch protection requires a single stable check named "Merge Gate".
  # Keeping the aggregate job means the ruleset does not need to change when
  # product jobs are added — a new product only has to join `needs`.
  merge-gate:
    name: Merge Gate
    if: ${{ always() }}
    needs: [loglens, diskmap, buildscope, buildscope-python, envlens, abilens]
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Require every product gate
        env:
          LOGLENS: ${{ needs.loglens.result }}
          DISKMAP: ${{ needs.diskmap.result }}
          BUILDSCOPE: ${{ needs.buildscope.result }}
          BUILDSCOPE_PYTHON: ${{ needs.buildscope-python.result }}
          ENVLENS: ${{ needs.envlens.result }}
          ABILENS: ${{ needs.abilens.result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "loglens:$LOGLENS" \
            "diskmap:$DISKMAP" \
            "buildscope:$BUILDSCOPE" \
            "buildscope-python:$BUILDSCOPE_PYTHON" \
            "envlens:$ENVLENS" \
            "abilens:$ABILENS"; do
            name="${pair%%:*}"
            result="${pair##*:}"
            if [ "$result" != success ]; then
              echo "::error::$name gate result: $result"
              failed=1
            fi
          done
          test "$failed" = 0
          echo "All product gates passed."
