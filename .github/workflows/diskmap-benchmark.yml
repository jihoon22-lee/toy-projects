name: DiskMap generated-source benchmark

# This is intentionally opt-in/nightly only.  The full million-entry run is
# useful for capacity and performance evidence, but it does not belong on the
# ordinary pull-request or merge-gate path.
on:
  workflow_dispatch:
    inputs:
      entries:
        description: "Generated entries (default: 1000000)"
        required: false
        default: "1000000"
        type: string
      cancel_after:
        description: "Cancellation point (default: 10000)"
        required: false
        default: "10000"
        type: string
      timeout_seconds:
        description: "Hard timeout for each benchmark process (default: 60)"
        required: false
        default: "60"
        type: string
  schedule:
    - cron: "37 3 * * 0"

permissions:
  contents: read

concurrency:
  group: diskmap-generated-source-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  # These values intentionally mirror diskmap/benchmarks/run_benchmark.py's
  # defaults.  No workflow-specific performance thresholds are invented until
  # a baseline supports a project-specific policy.
  BENCHMARK_ENTRIES: ${{ inputs.entries || '1000000' }}
  BENCHMARK_CANCEL_AFTER: ${{ inputs.cancel_after || '10000' }}
  BENCHMARK_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds || '60' }}

jobs:
  benchmark:
    name: DiskMap generated-source benchmark (Qt6)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install Qt6 toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev pkg-config g++ cmake

      - name: Configure and build benchmark
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/diskmap-benchmark/build"
          cmake -S diskmap -B "$build_dir" -DCMAKE_BUILD_TYPE=Release \
            -DDISKMAP_BUILD_BENCHMARKS=ON
          cmake --build "$build_dir" --parallel 2 \
            --target diskmap-scan-benchmark

      - name: Run full benchmark
        run: |
          set -euo pipefail
          artifact_dir="$GITHUB_WORKSPACE/benchmark-artifacts/qt6"
          mkdir -p "$artifact_dir"

          # The runner's built-in defaults are the only enforced budget policy
          # for now; update this comment when measured baselines justify new
          # workflow arguments rather than guessing at thresholds here.
          python3 diskmap/benchmarks/run_benchmark.py \
            --binary "$RUNNER_TEMP/diskmap-benchmark/build/benchmarks/diskmap-scan-benchmark" \
            --entries "$BENCHMARK_ENTRIES" \
            --cancel-after "$BENCHMARK_CANCEL_AFTER" \
            --timeout-seconds "$BENCHMARK_TIMEOUT_SECONDS" \
            --output-dir "$artifact_dir"

      - name: Validate artifact allowlist
        if: always()
        run: |
          set -euo pipefail
          artifact="benchmark-artifacts/qt6"
          test -d "$artifact"
          test -s "$artifact/summary.json"
          bad="$(find "$artifact" -type f ! \( -name '*.json' -o -name '*.md' -o -name '*.txt' \) -print -quit)"
          if [ -n "$bad" ]; then
            echo "::error::artifact contains a non-report file: $bad"
            exit 1
          fi
          oversized="$(find "$artifact" -type f -size +1G -print -quit)"
          if [ -n "$oversized" ]; then
            echo "::error::artifact contains an unexpectedly large file: $oversized"
            exit 1
          fi
          find "$artifact" -type f -print | sort

      - name: Verify benchmark verdict
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("benchmark-artifacts/qt6/summary.json").read_text(encoding="utf-8")
          )
          if summary.get("schema") != "diskmap-scan-benchmark-summary/v1":
              raise SystemExit("unsupported DiskMap summary schema")
          if summary.get("status") != "pass":
              raise SystemExit("DiskMap benchmark did not report PASS")
          PY

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diskmap-benchmark-qt6
          path: benchmark-artifacts/qt6
          if-no-files-found: error
          retention-days: 30
