name: LogLens large-file benchmark

# This is intentionally opt-in/nightly only.  It must never become a normal
# pull-request or merge-gate dependency: a 1 GiB input and capacity sweep are
# too expensive for the ordinary quality workflow.
on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Runs per component/capacity (default: 3)"
        required: false
        default: "3"
        type: string
      timeout_seconds:
        description: "Hard timeout for each benchmark process (default: 180)"
        required: false
        default: "180"
        type: string
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: loglens-large-file-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  BENCHMARK_BYTES: "1073741824"
  BENCHMARK_RECORDS: "1000000"
  BENCHMARK_CAPACITIES: "8192,16384,32768,65536,131072,262144"
  BENCHMARK_REPETITIONS: ${{ inputs.repetitions || '3' }}
  BENCHMARK_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds || '180' }}

jobs:
  benchmark:
    name: LogLens large-file benchmark (Qt6)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install Qt6 toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev pkg-config cmake g++

      - name: Check available disk space
        run: |
          set -euo pipefail
          df -Pk "$RUNNER_TEMP" .
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')"
          test "$available_kib" -ge 4194304

      - name: Configure and build benchmark targets
        working-directory: loglens
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/loglens-benchmark/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLOGLENS_BUILD_BENCHMARKS=ON \
            2>&1 | tee "$RUNNER_TEMP/loglens-benchmark/configure.log"
          grep -Eq "loglens: using Qt6 " "$RUNNER_TEMP/loglens-benchmark/configure.log"
          cmake --build "$RUNNER_TEMP/loglens-benchmark/build" --parallel 2 \
            --target loglens-bench-generate loglens-bench-core loglens-bench-gui

      - name: Run generator, core, GUI, and aggregate
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          mkdir -p "benchmark-artifacts/qt6"
          python3 loglens/benchmarks/run_benchmark.py \
            --build-dir "$RUNNER_TEMP/loglens-benchmark/build" \
            --scratch "$RUNNER_TEMP/loglens-benchmark/scratch" \
            --artifact-dir "$GITHUB_WORKSPACE/benchmark-artifacts/qt6" \
            --qt-major 6 \
            --bytes "$BENCHMARK_BYTES" \
            --records "$BENCHMARK_RECORDS" \
            --capacities "$BENCHMARK_CAPACITIES" \
            --repetitions "$BENCHMARK_REPETITIONS" \
            --timeout-seconds "$BENCHMARK_TIMEOUT_SECONDS"

      - name: Validate artifact allowlist
        if: always()
        run: |
          set -euo pipefail
          artifact="benchmark-artifacts/qt6"
          test -d "$artifact"
          bad="$(find "$artifact" -type f ! \( -name '*.json' -o -name '*.md' -o -name '*.txt' \) -print -quit)"
          if [ -n "$bad" ]; then
            echo "::error::artifact contains a non-report file: $bad"
            exit 1
          fi
          oversized="$(find "$artifact" -type f -size +1G -print -quit)"
          if [ -n "$oversized" ]; then
            echo "::error::artifact contains an unexpectedly large file: $oversized"
            exit 1
          fi
          find "$artifact" -type f -print | sort

      - name: Verify benchmark verdict
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("benchmark-artifacts/qt6/summary.json").read_text(encoding="utf-8")
          )
          if summary.get("decision", {}).get("status") != "pass":
              raise SystemExit("LogLens benchmark did not report PASS")
          PY

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loglens-benchmark-qt6
          path: benchmark-artifacts/qt6
          if-no-files-found: error
          retention-days: 30
