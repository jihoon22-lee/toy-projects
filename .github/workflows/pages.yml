name: pages

# Product documentation site: each product's README and docs/ are rendered
# into a Jekyll site and deployed to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - ".github/scripts/assemble_pages.py"
      - "README.md"
      - "ROADMAP.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "*/CHANGELOG.md"
      - "*/schemas/**"
      - "*/examples/**"
      - "*/assets/**"
      - "*/resources/**"
      - "*/README.md"
      - "*/docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble documentation sources
        run: |
          set -euo pipefail
          site="$GITHUB_WORKSPACE/.pages-src"
          python3 .github/scripts/assemble_pages.py "$site"
          echo "site=$site" >> "$GITHUB_OUTPUT"
        id: site

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: .pages-src
          destination: .pages-src/_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ steps.site.outputs.site }}/_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
