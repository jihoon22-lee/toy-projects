name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.manual.outputs.created || steps.release.outputs.releases_created }}
      matrix: ${{ steps.manual.outputs.matrix || steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Start CI for created or updated release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs || '[]' }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          repository = os.environ['GH_REPO']
          for created in json.loads(os.environ['RELEASE_PRS']):
              number = created.get('number')
              if type(number) is not int or number <= 0:
                  raise SystemExit('release output has an invalid PR number')
              pull = json.loads(subprocess.check_output([
                  'gh', 'api', f'repos/{repository}/pulls/{number}'
              ], text=True))
              if pull['head']['repo']['full_name'] != repository:
                  raise SystemExit('release PR must belong to this repository')
              subprocess.run([
                  'gh', 'workflow', 'run', 'ci.yml', '--repo', repository,
                  '--ref', pull['head']['ref']
              ], check=True)
          PY
      - name: Resolve created product tags
        id: matrix
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          outputs = json.loads(os.environ['RELEASE_OUTPUTS'])
          releases = []
          if outputs.get('releases_created') == 'true':
              # Single-package release: the root component emits a plain
              # top-level tag_name/sha (e.g. v0.4.2), not per-path outputs.
              tag = outputs.get('tag_name', '')
              if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', tag):
                  raise SystemExit('unexpected release tag')
              sha = outputs.get('sha', '')
              if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                  raise SystemExit('release output is missing an exact commit SHA')
              releases.append({'tag': tag, 'sha': sha})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': releases}) + '\n')
          PY

      # Manual `chore(release):` bumps (README §릴리스 절차) do not create
      # release-please outputs. Detect them by comparing the manifest version
      # against existing tags and emit the same matrix entry, so release.yml
      # builds and publishes without a separate manual dispatch.
      - name: Resolve manual release bump
        id: manual
        if: steps.release.outputs.releases_created != 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          manifest = json.loads(open('.release-please-manifest.json').read())
          version = manifest.get('.')
          if not isinstance(version, str) or not re.fullmatch(
              r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', version):
              raise SystemExit('manifest has no valid "." version')
          tag = 'v' + version
          res = subprocess.run(
              ['gh', 'api', f'repos/{os.environ["GH_REPO"]}/git/ref/tags/{tag}'],
              capture_output=True, text=True)
          if res.returncode == 0:
              print(f'tag {tag} already exists; nothing to release')
              sys.exit(0)
          # A non-404 failure (rate limit, network) must not be treated as
          # "tag missing" — that would publish a tag pointing at nothing.
          if '404' not in (res.stderr + res.stdout):
              sys.stderr.write(res.stderr)
              raise SystemExit('tag lookup failed (not a 404)')
          sha = os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
              raise SystemExit('missing exact commit SHA')
          entry = {'include': [{'tag': tag, 'sha': sha}]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(entry) + '\n')
              output.write('created=true\n')
          print(f'manual release bump detected: {tag} at {sha}')
          PY

  # GITHUB_TOKEN-created tag events do not start another workflow. Call the
  # artifact workflow directly, once for every release output.
  artifacts:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-please.outputs.matrix) }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ matrix.tag }}
      sha: ${{ matrix.sha }}
    secrets: inherit
