name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.3.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: |
          cargo build --release -p lens-cli -p lens-tui -p lens-mcp

      - name: Package artifacts
        id: package
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ARCHIVE_NAME="lens-${TAG}-linux-x86_64.tar.gz"
          mkdir -p dist
          tar -czvf "dist/${ARCHIVE_NAME}" -C target/release lens lens-tui lens-mcp
          cd dist
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          cd ..
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "archive=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: "Release ${{ steps.package.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
