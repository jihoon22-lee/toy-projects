name: release

on:
  push:
    tags: ["*/v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Product tag, e.g. loglens/v0.1.2"
        required: true
        type: string
      sha:
        description: "Exact source commit for a draft retry (optional)"
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: product-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIST: dist
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      REQUESTED_SHA: ${{ inputs.sha }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate tag
        id: tag
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^(loglens|diskmap|buildscope|abilens|envlens|tracelens|testlens|servicelens)/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::Unsupported product tag'; exit 1
          fi
          echo "product=${RELEASE_TAG%%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#*/}" >> "$GITHUB_OUTPUT"
      - name: Resolve the immutable source commit
        id: source
        run: |
          set -euo pipefail
          tag_sha="$(gh api --method GET "repos/$GH_REPO/commits" -f sha="$RELEASE_TAG" -f per_page=1 --jq '.[0].sha' 2>/dev/null)" || tag_sha=""
          sha="$REQUESTED_SHA"
          if [ -z "$sha" ]; then
            sha="$tag_sha"
          fi
          if [ -z "$sha" ]; then
            sha="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)"
          fi
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::A draft retry requires an exact source SHA'; exit 1
          fi
          sha="$(gh api "repos/$GH_REPO/commits/$sha" --jq .sha)"
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$sha" ]; then
            echo '::error::Existing tag points to a different source commit'; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.sha }}
      - name: Verify an already published release
        id: state
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release-state.json"; then
            if [ "$(jq -r .isDraft "$RUNNER_TEMP/release-state.json")" = false ]; then
              mkdir -p "$RUNNER_TEMP/published-assets"
              gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/published-assets"
              (cd "$RUNNER_TEMP/published-assets" && sha256sum -c SHA256SUMS.txt)
              echo 'published=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Set up documentation validation
        if: steps.state.outputs.published != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Check documentation before packaging
        if: steps.state.outputs.published != 'true'
        run: |
          python -m pip install jsonschema==4.25.1
          python .github/scripts/check_docs.py
      - name: Install native dependencies
        if: steps.state.outputs.published != 'true' && contains(fromJSON('["loglens","diskmap","buildscope","tracelens","abilens"]'), steps.tag.outputs.product)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev pkg-config build-essential libdw-dev binutils
      - name: Build, test and install CMake product
        if: steps.state.outputs.published != 'true' && contains(fromJSON('["loglens","diskmap","buildscope","tracelens"]'), steps.tag.outputs.product)
        env:
          PRODUCT: ${{ steps.tag.outputs.product }}
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          cmake -S "$PRODUCT" -B "$PRODUCT/build/release" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$PRODUCT/build/release" --parallel 2
          ctest --test-dir "$PRODUCT/build/release" --output-on-failure
          cmake --install "$PRODUCT/build/release" --prefix "$PWD/stage/$PRODUCT"
          test -x "stage/$PRODUCT/bin/$PRODUCT"
          "stage/$PRODUCT/bin/$PRODUCT" --help >/dev/null
      - name: Build, test and install AbiLens
        if: steps.state.outputs.published != 'true' && steps.tag.outputs.product == 'abilens'
        run: |
          set -euo pipefail
          make -C abilens WITH_DWARF=1 -j2 check
          make -C abilens WITH_DWARF=1 PREFIX="$PWD/stage/abilens" install
          stage/abilens/bin/abilens --version
      - name: Package installed native layout
        if: steps.state.outputs.published != 'true' && contains(fromJSON('["loglens","diskmap","buildscope","tracelens","abilens"]'), steps.tag.outputs.product)
        env:
          PRODUCT: ${{ steps.tag.outputs.product }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$DIST"
          observed="$("stage/$PRODUCT/bin/$PRODUCT" --version)"
          test "${observed##* }" = "${VERSION#v}"
          cp "$PRODUCT/README.md" "stage/$PRODUCT/README.md"
          if [ -f "$PRODUCT/LICENSE" ]; then cp "$PRODUCT/LICENSE" "stage/$PRODUCT/LICENSE"; fi
          {
            echo 'Linux x86-64 build; system libraries are not bundled.'
            echo 'Qt GUI products require a compatible Qt6 runtime and platform plugin.'
            echo 'AbiLens DWARF builds require libdw and libelf.'
            find "stage/$PRODUCT/bin" -type f -executable -exec ldd {} \;
          } > "stage/$PRODUCT/RUNTIME-DEPENDENCIES.txt"
          tar -czf "$DIST/$PRODUCT-$VERSION-linux-x86_64.tar.gz" -C "stage/$PRODUCT" .
          mkdir -p "$RUNNER_TEMP/package-test"
          tar -xzf "$DIST/$PRODUCT-$VERSION-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/package-test"
          "$RUNNER_TEMP/package-test/bin/$PRODUCT" --help >/dev/null
      - name: Build Python distributions and verify installed CLI
        if: steps.state.outputs.published != 'true' && contains(fromJSON('["envlens","testlens","servicelens"]'), steps.tag.outputs.product)
        env:
          PRODUCT: ${{ steps.tag.outputs.product }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          python3 -m pip install build
          python3 -m build --outdir "$DIST" "$PRODUCT"
          python3 -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/pip" install "$DIST"/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/consumer/bin/$PRODUCT" --version
          "$RUNNER_TEMP/consumer/bin/python" - <<'PY'
          import importlib
          import importlib.metadata
          import os
          product = os.environ['PRODUCT']
          expected = os.environ['VERSION'].removeprefix('v')
          assert importlib.metadata.version(product) == expected
          assert importlib.import_module(product).__version__ == expected
          PY
      - name: Checksum artifacts
        if: steps.state.outputs.published != 'true'
        run: |
          set -euo pipefail
          cd "$DIST"
          test -n "$(find . -type f -print -quit)"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/product-checksums"
          mv "$RUNNER_TEMP/product-checksums" SHA256SUMS.txt
      - name: Attest build provenance
        if: steps.state.outputs.published != 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ env.DIST }}/*
      - name: Upload draft assets, verify and publish
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        if: steps.state.outputs.published != 'true'
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --draft --title "$RELEASE_TAG" --generate-notes
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" "$DIST"/* --clobber
          mkdir -p "$RUNNER_TEMP/upload-verification"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/upload-verification"
          (cd "$RUNNER_TEMP/upload-verification" && sha256sum -c SHA256SUMS.txt)
          tag_sha="$(gh api --method GET "repos/$GH_REPO/commits" -f sha="$RELEASE_TAG" -f per_page=1 --jq '.[0].sha' 2>/dev/null)" || tag_sha=""
          if [ -z "$tag_sha" ]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$SOURCE_SHA" >/dev/null
            tag_sha="$(gh api --method GET "repos/$GH_REPO/commits" -f sha="$RELEASE_TAG" -f per_page=1 --jq '.[0].sha')"
          fi
          test "$tag_sha" = "$SOURCE_SHA"
          gh release edit "$RELEASE_TAG" --target "$SOURCE_SHA" --draft=false --latest=false
