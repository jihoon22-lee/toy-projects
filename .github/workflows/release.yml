name: release

# Product release artifacts. release-please creates tags of the form
# {product}/v{version} plus a GitHub release; this workflow builds the
# product's release payload on that tag, checksums and attests it, and
# attaches the assets to the release.

on:
  push:
    tags: ["*/v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIST: dist
    steps:
      - name: Resolve product and version from tag
        id: tag
        run: |
          set -euo pipefail
          product="${GITHUB_REF_NAME%%/*}"
          version="${GITHUB_REF_NAME#*/}"
          case "$product" in
            loglens|diskmap|buildscope|abilens|envlens) ;;
            *) echo "::error::tag ${GITHUB_REF_NAME} is not a product release"; exit 1 ;;
          esac
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Qt6
        if: contains(fromJSON('["loglens","diskmap","buildscope"]'), steps.tag.outputs.product)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev pkg-config

      - name: Build CMake product
        if: contains(fromJSON('["loglens","diskmap","buildscope"]'), steps.tag.outputs.product)
        run: |
          set -euo pipefail
          cmake -S "${{ steps.tag.outputs.product }}" \
            -B "${{ steps.tag.outputs.product }}/build/release" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "${{ steps.tag.outputs.product }}/build/release" --parallel 2
          QT_QPA_PLATFORM=offscreen \
            ctest --test-dir "${{ steps.tag.outputs.product }}/build/release" \
            --output-on-failure

      - name: Package LogLens binaries
        if: steps.tag.outputs.product == 'loglens'
        run: |
          set -euo pipefail
          mkdir -p "$DIST"
          tar -czf "$DIST/loglens-${{ steps.tag.outputs.version }}-linux-x86_64.tar.gz" \
            -C loglens/build/release \
            loglens src/gui/loglens-gui

      - name: Package DiskMap binaries
        if: steps.tag.outputs.product == 'diskmap'
        run: |
          set -euo pipefail
          mkdir -p "$DIST"
          tar -czf "$DIST/diskmap-${{ steps.tag.outputs.version }}-linux-x86_64.tar.gz" \
            -C diskmap/build/release \
            src/diskmap src/gui/diskmap-gui

      - name: Package BuildScope binaries
        if: steps.tag.outputs.product == 'buildscope'
        run: |
          set -euo pipefail
          mkdir -p "$DIST"
          tar -czf "$DIST/buildscope-${{ steps.tag.outputs.version }}-linux-x86_64.tar.gz" \
            -C buildscope/build/release \
            src/native/buildscope src/core/buildscope-cli src/gui/buildscope-gui

      - name: Build AbiLens
        if: steps.tag.outputs.product == 'abilens'
        run: |
          set -euo pipefail
          make -C abilens release

      - name: Package AbiLens
        if: steps.tag.outputs.product == 'abilens'
        run: |
          set -euo pipefail
          mkdir -p "$DIST"
          tar -czf "$DIST/abilens-${{ steps.tag.outputs.version }}-linux-x86_64.tar.gz" \
            -C abilens/build bin/abilens lib/libabilens.a

      - name: Build envlens distributions
        if: steps.tag.outputs.product == 'envlens'
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade build
          python3 -m build --outdir "$DIST" envlens

      - name: Checksum artifacts
        run: |
          set -euo pipefail
          cd "$DIST"
          test -n "$(find . -type f -print -quit)"
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ env.DIST }}/*

      # Immutable releases freeze assets on publish, so the release is created
      # as a draft, populated, and only then published.
      - name: Upload release assets and publish
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.product }}/${{ steps.tag.outputs.version }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft \
              --title "$tag" --generate-notes
          fi
          gh release upload "$tag" "$DIST"/* --clobber
          gh release edit "$tag" --draft=false --latest=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
