[workspace]
members = [
    "crates/lens-core",
    "crates/lens-disk",
    "crates/lens-abi",
    "crates/lens-log",
    "crates/lens-test",
    "crates/lens-trace",
    "crates/lens-sys",
    "crates/lens-build",
    "crates/lens-env",
    "crates/lens-cli",
    "crates/lens-tui",
    "crates/lens-mcp",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Jihoon Lee"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jihoon22-lee/toy-projects"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0"
memmap2 = "0.9"
rayon = "1.10"
walkdir = "2.5"
quick-xml = "0.37"
clap = { version = "4.5", features = ["derive"] }
object = { version = "0.36", default-features = false, features = ["read_core", "elf"] }
gimli = { version = "0.31", default-features = false, features = ["read"] }
flate2 = "1.0"
regex = "1.11"
crossterm = "0.28"
ratatui = "0.29"
