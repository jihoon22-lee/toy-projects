[project]
name = "diskmap"
version = "0.1.0"
source_dirs = ["src"]

# The Qt shell is project source like everything else, so it lives under src/
# and every engine reads it. cpp_pkg_config gives lint the Qt include paths it
# needs to parse the widget sources at all. QtConcurrent is a separate module
# and the scan runs on it, so it has to be declared too — omitting it makes
# lint fail with a missing-header error.
#
# cpp_external_build_dirs used to sit here as well, keeping src/gui out of the
# test link because Q_OBJECT classes need moc-generated sources that a bare g++
# call cannot provide. ici 0.6.0 drives qmake for build, test and sanitize
# alike, so moc runs and the GUI is compiled, unit-tested and sanitized like
# the core.
# Keep the preferred Qt 6 modules first, then the equivalent Qt 5 modules. ici
# skips packages unavailable on the host, while the CI GUI matrix separately
# proves that every selected major resolves the same module set.
cpp_pkg_config = ["Qt6Widgets", "Qt6Concurrent", "Qt5Widgets", "Qt5Concurrent"]

# 임계값을 명시적으로 고정한다. 생략하면 개발자 홈의 ~/.config/ici/ici.toml 을 따르게 되어
# 로컬과 CI 결과가 갈린다. 값 자체는 ici 기본 정책과 동일하다 — 실측이 이를 넘기므로
# 낮출 이유가 없다 (line 95.0%, branch 92.3%, func 97.2%, TEM 4.86).
[engines.test]
enabled = true
mode = "pass_fail"
min_tem_score = 4.0
min_branch_cov = 80.0
min_func_cov = 90.0
