[project]
name = "diskmap"
version = "0.1.0"
source_dirs = ["src"]

# The Qt shell is project source like everything else, so it lives under src/
# and every text- and AST-based engine reads it. Two settings make that work:
#
#   cpp_pkg_config          gives lint the Qt include paths it needs to parse
#                           the widget sources at all
#   cpp_external_build_dirs tells the engines that produce a binary to skip
#                           src/gui — Q_OBJECT classes need moc-generated
#                           sources that a bare g++ call cannot provide
#
# The GUI is therefore linted, measured for complexity and duplication, and
# scanned for exception and security problems. It is excluded only from
# unit-test linking, where CMake and the CI smoke run cover it instead.
# QtConcurrent is a separate module and the scan runs on it, so it has to be
# declared too — omitting it makes lint fail with a missing-header error.
cpp_pkg_config = ["Qt6Widgets", "Qt6Concurrent"]
cpp_external_build_dirs = ["src/gui"]

# 임계값을 명시적으로 고정한다. 생략하면 개발자 홈의 ~/.config/ici/ici.toml 을 따르게 되어
# 로컬과 CI 결과가 갈린다. 값 자체는 ici 기본 정책과 동일하다 — 실측이 이를 넘기므로
# 낮출 이유가 없다 (line 95.0%, branch 92.3%, func 97.2%, TEM 4.86).
[engines.test]
enabled = true
mode = "pass_fail"
min_tem_score = 4.0
min_branch_cov = 80.0
min_func_cov = 90.0

# dead 엔진은 Python 전용이라(src/ici/engines/dead.py 가 get_all_python_sources 만 사용)
# 순수 C++ 프로젝트에서는 항상 SKIP 한다. 그런데 required 엔진의 SKIP 은
# aggregate_suite_status(core/models.py:68-79) 에서 스위트 전체를 ERROR 로 승격시킨다.
# 그 결과 코드 품질과 무관하게 C++ 프로젝트는 영구히 빨간불이 된다.
# required=false 로 두면 SKIP 근거는 리포트에 그대로 남으면서 거짓 게이트 실패만 걷힌다.
# (enabled=false 가 아니라 required=false 를 쓰는 이유 — 증거는 남겨야 한다)
[engines.dead]
required = false
