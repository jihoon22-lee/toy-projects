[project]
name = "loglens"
version = "0.1.0"
source_dirs = ["src"]

# The Qt shell is project source like everything else, so it lives under src/
# and every engine reads it. cpp_pkg_config gives lint the Qt include paths it
# needs to parse the widget sources at all. Listing both majors lets the same
# project config work on Qt 6 and Qt 5.15 hosts; ici skips unavailable packages.
#
# cpp_external_build_dirs used to sit here too, keeping src/gui out of the test
# link because Q_OBJECT classes need moc-generated sources that a bare g++ call
# cannot provide. ici 0.6.0 drives CMake for build, test and sanitize alike, so
# moc runs and the GUI is compiled, unit-tested and sanitized like the core.
cpp_pkg_config = ["Qt6Widgets", "Qt5Widgets"]

# 임계값을 명시적으로 고정한다. 생략하면 개발자 홈의 ~/.config/ici/ici.toml 을 따르게 되어
# 로컬과 CI 결과가 갈린다.
#
# ici 0.6.0 에서 분모가 바뀌었다. 그 전에는 cpp_external_build_dirs 가 src/gui 를 링크에서
# 빼서 Qt 셸이 커버리지에 아예 잡히지 않았고, 그 상태의 실측이 branch 92.3% / func 97.2%
# 였다. 이제 빌드 어댑터가 GUI 까지 빌드하므로 셸이 분모에 들어온다.
#
#   src/gui/log_model.cpp        테스트됨 (tests/test_log_model.cpp)
#   src/gui/main_window.cpp      테스트됨 (tests/test_main_window.cpp)
#   src/gui/timeline_widget.cpp  렌더링 분기 테스트됨 (tests/test_main_window.cpp)
#
# 셸 테스트를 추가한 뒤 ici 0.6.0으로 실측한 값은 line 93.2% / function 96.9% /
# branch 81.8% / TEM 4.84 이다. branch는 timeline paint의 예외적인 QPainter 경로와
# 생성자 예외 분기까지 모두 안정적으로 재현하기 어렵기 때문에, 실측값 아래에 6.8%p
# slack을 둔 75.0을 게이트로 삼는다. function은 실측값 아래 4.9%p인 92.0을 쓴다.
# 남은 미검증 범위는 QPainter/Qt 내부 예외 경로와 ici의 C++ type-check engine이므로,
# threshold를 수치에 맞춰 낮추지 않고 테스트 가능한 application state를 우선 게이트한다.
[engines.test]
enabled = true
mode = "pass_fail"
min_tem_score = 4.0
min_branch_cov = 75.0
min_func_cov = 92.0
