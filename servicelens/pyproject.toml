[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "servicelens"
version = "0.2.0"
description = "Offline systemd configuration provenance and comparison"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
servicelens = "servicelens.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "jsonschema>=4.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/servicelens"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "servicelens/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[tool.hatch.build.targets.sdist]
include = ["src", "schemas", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml", "uv.lock"]
