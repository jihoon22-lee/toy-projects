[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "testlens"
version = "0.2.0"
description = "Evidence-preserving local test result analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["defusedxml>=0.7.1,<0.8", "jsonschema>=4.23,<5"]

[project.scripts]
testlens = "testlens.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "jsonschema>=4.23", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/testlens"]
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "testlens/schemas"
[tool.hatch.build.targets.sdist]
include = ["src", "schemas", "tests", "examples", "scripts", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml", "uv.lock"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.10"
strict = true
[[tool.mypy.overrides]]
module = ["defusedxml.*", "jsonschema.*"]
ignore_missing_imports = true
